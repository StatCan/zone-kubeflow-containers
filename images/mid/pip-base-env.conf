# Shipped to /opt/conda/pip.conf -- pip's *site* scope. https://jirab.statcan.ca/browse/ZONE-543
#
# pip only reads this file when sys.prefix is /opt/conda, i.e. the base conda
# environment. A venv or a user conda env has its own sys.prefix and never sees
# it, so `pip install` inside one behaves exactly as before. That is why this
# lives here and not in /etc/pip.conf (global scope), which every environment
# reads and which makes `pip install` fail outright inside a venv with
# "Can not perform a '--user' install. User site-packages are not visible in
# this virtualenv."
#
# Why: fix-permissions makes /opt/conda/lib/pythonX.Y/site-packages writable by
# the `users` group, so a bare `pip install foo` in the base env succeeds but
# writes into the container layer -- the package is gone the next time the
# notebook server restarts. Redirecting to the user scheme puts it under
# ~/.local/lib/pythonX.Y/site-packages, which is on the workspace volume.
#
# Escape hatch: `pip install --no-user foo` restores the old, ephemeral
# behaviour. Needed for Jupyter *server* extensions, which the server has to
# import and which the user site directory therefore cannot supply -- the
# service runs with -s -- and for `pip install --target`, which cannot be
# combined with a user install. Front-end lab extensions are unaffected: they
# are discovered from ~/.local/share/jupyter/labextensions on disk, which stays
# on the server's search path.
#
# `pip config set` also needs an explicit scope now: pip targets this file as
# soon as it exists, and it is root-owned. See s6/cont-init.d/02-start-custom.
[install]
user = true

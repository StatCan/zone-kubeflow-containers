[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otto"
version = "0.3.0"
description = "Broker-authenticated coding agent CLI for Zone notebooks."
requires-python = ">=3.9"
dependencies = ["openai"]

[project.scripts]
otto = "otto.cli:main"

[tool.setuptools]
packages = ["otto"]

name: Build and Push upstream image if needed

env:
  HADOLINT_VERSION: "2.12.0"

on:
  workflow_call:
    inputs:
      base-image:
        description: The base image to build from if not located on our own repo
        required: false
        type: string
      registry-name:
        description: url of the registry <registy-name>
        required: true
        type: string
      branch-name:
        description: The name of the current branch 
        required: true
        type: string
    outputs:
      is-diff:
        description: Is there a difference between the target branch and the current branch
        value: ${{ jobs.check-diff.outputs.is-diff }}
    secrets:
      REGISTRY_USERNAME:
        description: The username for the container registry
        required: true
      REGISTRY_PASSWORD:
        description: The password for the container registry
        required: true

jobs:
  check-diff:
    runs-on: ubuntu-latest
    outputs:
      is-diff: ${{ steps.check-changes.outputs.is-diff }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch target branch
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Check for changes
        id: check-changes
        run: | # Check for changes excluding README.md
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "Always build on pushes to master and beta"
            echo "is-diff=true" >> $GITHUB_OUTPUT
          # Check if the subdirectory exists in the base branch
          elif ! git ls-tree -d origin/${{ github.event.pull_request.base.ref }} -- "images/upstream" >/dev/null 2>&1; then
            echo "Subdirectory does not exist in the base branch"
            echo "is-diff='true'" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD -- "images/upstream/*" || true)
            NEW_FILES=$(git diff --name-only --diff-filter=A origin/${{ github.event.pull_request.base.ref }} HEAD -- "images/upstream/* || true)
            
            CHANGES="${CHANGES}${NEW_FILES}"

            if [ -n "$CHANGES" ]; then
              echo "Changes detected (excluding README.md)"
              echo "is-diff=true" >> $GITHUB_OUTPUT
            else
              echo "No changes detected"
              echo "is-diff=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-upload:
    needs: [check-diff]
    if: ${{ needs.check-diff.outputs.is-diff == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        run: |
          sudo curl -L https://github.com/hadolint/hadolint/releases/download/v${{ env.HADOLINT_VERSION }}/hadolint-Linux-x86_64 --output hadolint
          sudo chmod +x hadolint
          ./hadolint images/upstream/docker-stacks-foundation/Dockerfile --no-fail
          ./hadolint images/upstream/base-notebook/Dockerfile --no-fail
          ./hadolint images/upstream/minimal-notebook/Dockerfile --no-fail
          ./hadolint images/upstream/scipy-notebook/Dockerfile --no-fail

      - name: Echo disk usage before clean up
        run: ./.github/scripts/echo_usage.sh

      - name: Free up all available disk space before building
        run: ./.github/scripts/cleanup_runner.sh

      - name: Echo disk usage before build start
        run: ./.github/scripts/echo_usage.sh

      # Connect to Azure Container registry (ACR)
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ inputs.registry-name }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set short SHA
        run: |
          shortSha=$(git rev-parse --short ${{ github.sha}})
          echo "COMMIT_SHORT_SHA=$shortSha"
          echo "COMMIT_SHORT_SHA=$shortSha" >> $GITHUB_ENV

      - name: Build image
        id: build-image
        run: |
          tags="${{inputs.branch-name}} ${{env.COMMIT_SHORT_SHA}} ${{github.sha}}"
          
          # adds tags for master
          if [ "${{ inputs.branch-name }}" == 'master' ]; then
            tags="${tags} v2 latest"
          fi

          make bake-upstream BASE_IMAGE=${{ inputs.base-image }} REPO=${{ inputs.registry-name }} TAGS="${tags}"

      - name: Echo disk usage after build completion
        run: ./.github/scripts/echo_usage.sh

      - name: Push image to registry (default pushes all tags)
        run: make push/scipy-notebook REPO=${{ inputs.registry-name }}

      # Free up space from build process (containerscan action will run out of space if we don't)
      - run: ./.github/scripts/cleanup_runner.sh

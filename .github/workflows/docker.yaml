name: Build, test, and push Docker Images
on:
  push:
    branches:
      - "master"
      - "beta"
    paths:
      - ".github/workflows/*"
      - "images/**"
      - "!images/*/README.md"
      - "tests/**"
      - "!tests/README.md"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - ".github/workflows/*"
      - "images/**"
      - "!images/*/README.md"
      - "tests/**"
      - "!tests/README.md"
      - "requirements-dev.txt"

jobs:

# Set shared variables:
  vars:
    runs-on: ubuntu-latest
    outputs:
      REGISTRY_NAME: "stcthezoneacr.azurecr.io"
      branch-name: ${{ steps.getBranch.outputs.branch-name }}
      beta: ""${{ steps.ifBeta.outputs.beta }}
    steps:
      - uses: actions/checkout@v4

      - name: Get branch name
        id: getBranch
        run: |
          chmod +x ./make_helpers/get_branch_name.sh
          BRANCH_NAME=$(./make_helpers/get_branch_name.sh)
          echo "branch-name=$BRANCH_NAME"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
    
      - name: Check if branch is beta
        id: ifBeta
        if: ${{ steps.getBranch.outputs.branch-name == 'beta' }}
        run: echo "::set-output name=beta::-beta"

# Publish images:
  base:
    needs: [vars]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "base"${{needs.vars.outputs.beta}}
      directory: "base"${{needs.vars.outputs.beta}}
      base-image: "quay.io/jupyter/datascience-notebook:2025-08-15"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  mid:
    needs: [vars, base]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "mid"${{needs.vars.outputs.beta}}
      directory: "mid"${{needs.vars.outputs.beta}}
      parent-image: "base"${{needs.vars.outputs.beta}}
      parent-image-is-diff: "${{ needs.base.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  rstudio:
    needs: [vars, mid]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "rstudio"${{needs.vars.outputs.beta}}
      directory: "rstudio"${{needs.vars.outputs.beta}}
      parent-image: "mid"${{needs.vars.outputs.beta}}
      parent-image-is-diff: "${{ needs.mid.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  sas-kernel:
    needs: [vars, rstudio]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "sas-kernel"${{needs.vars.outputs.beta}}
      directory: "sas_kernel"${{needs.vars.outputs.beta}}
      parent-image: "rstudio"${{needs.vars.outputs.beta}}
      parent-image-is-diff: "${{ needs.rstudio.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      SAS_SA_NAME: ${{ secrets.SAS_SA_NAME }}
      SAS_SA_KEY_1: ${{ secrets.SAS_SA_KEY_1 }}

  jupyterlab-cpu:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "jupyterlab-cpu"${{needs.vars.outputs.beta}}
      directory: "jupyterlab"${{needs.vars.outputs.beta}}
      parent-image: "sas-kernel"${{needs.vars.outputs.beta}}
      parent-image-is-diff: "${{ needs.sas-kernel.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  sas:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "sas"${{needs.vars.outputs.beta}}
      directory: "sas"${{needs.vars.outputs.beta}}
      parent-image: "sas-kernel"${{needs.vars.outputs.beta}}
      parent-image-is-diff: "${{ needs.sas-kernel.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}


# Test images
  base-test:
    needs: [vars, base]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "base"${{needs.vars.outputs.beta}}
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  mid-test:
    needs: [vars, mid]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "mid"${{needs.vars.outputs.beta}}
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  rstudio-test:
    needs: [vars, rstudio]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "rstudio"${{needs.vars.outputs.beta}}
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  sas-kernel-test:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "sas-kernel"${{needs.vars.outputs.beta}}
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  jupyterlab-cpu-test:
    needs: [vars, jupyterlab-cpu]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "jupyterlab-cpu"${{needs.vars.outputs.beta}}
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  sas-test:
    needs: [vars, sas]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "sas"${{needs.vars.outputs.beta}}
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}


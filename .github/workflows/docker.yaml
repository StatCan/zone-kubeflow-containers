name: Build, test, and push Docker Images
on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/*"
      - ".github/scripts/image-route.sh"
      - "make_helpers/bake-build.sh"
      - "make_helpers/get_branch_name.sh"
      - "Makefile"
      - "images/**"
      - "!images/*/README.md"
      - "tests/**"
      - "!tests/README.md"
      - "docker-bake.hcl"
      - "requirements-dev.txt"
  pull_request:
    branches: [beta, master, main]
    paths:
      - ".github/workflows/*"
      - ".github/scripts/image-route.sh"
      - "make_helpers/bake-build.sh"
      - "make_helpers/get_branch_name.sh"
      - "Makefile"
      - "images/**"
      - "!images/*/README.md"
      - "tests/**"
      - "!tests/README.md"
      - "docker-bake.hcl"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  vars:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pr-run: ${{ steps.duplicate.outputs.pr-run }}
      REGISTRY_NAME: "stcthezoneacr.azurecr.io"
      repository-suffix: ${{ steps.route.outputs.repository-suffix }}
      tags: ${{ steps.route.outputs.tags }}
    steps:
      - name: Check for a PR run covering this feature push
        id: duplicate
        if: github.event_name == 'push' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/beta'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! pr_run=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yaml/runs" \
            -f event=pull_request -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" \
            --jq 'first(.workflow_runs[] | select(.head_repository.id == .repository.id and
              (.status == "queued" or .status == "in_progress")) | .html_url) // empty'); then
            echo "::warning::Could not check for a PR run. Continuing with the feature build."
            exit 0
          fi
          if [[ -n $pr_run ]]; then
            echo "The PR workflow covers this push: $pr_run" >> "$GITHUB_STEP_SUMMARY"
            echo "pr-run=$pr_run" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - name: Select image repository and tags
        id: route
        run: bash .github/scripts/image-route.sh >> "$GITHUB_OUTPUT"

  upstream-scipy:
    if: needs.vars.outputs.pr-run == ''
    needs: [vars]
    uses: ./.github/workflows/docker-build-upstream.yaml
    with:
      base-image: "ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tags: ${{ needs.vars.outputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  base:
    needs: [vars, upstream-scipy]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "base"
      directory: "base"
      parent-image: "scipy-notebook"
      parent-image-is-diff: "${{ needs.upstream-scipy.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tags: ${{ needs.vars.outputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  mid:
    needs: [vars, base]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "mid"
      directory: "mid"
      parent-image: "base"
      parent-image-is-diff: "${{ needs.base.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tags: ${{ needs.vars.outputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  rstudio:
    needs: [vars, mid]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "rstudio"
      directory: "rstudio"
      parent-image: "mid"
      parent-image-is-diff: "${{ needs.mid.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tags: ${{ needs.vars.outputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  sas-kernel:
    needs: [vars, rstudio]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "sas-kernel"
      directory: "sas_kernel"
      parent-image: "rstudio"
      parent-image-is-diff: "${{ needs.rstudio.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tags: ${{ needs.vars.outputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      SAS_SA_NAME: ${{ secrets.SAS_SA_NAME }}
      SAS_SA_KEY_1: ${{ secrets.SAS_SA_KEY_1 }}

  jupyterlab-cpu:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "jupyterlab-cpu"
      directory: "jupyterlab"
      parent-image: "sas-kernel"
      parent-image-is-diff: "${{ needs.sas-kernel.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tags: ${{ needs.vars.outputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  sas:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "sas"
      directory: "sas"
      parent-image: "sas-kernel"
      parent-image-is-diff: "${{ needs.sas-kernel.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tags: ${{ needs.vars.outputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  # Test the Images

  base-test:
    needs: [vars, base]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "base"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tag: ${{ github.sha }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  mid-test:
    needs: [vars, mid]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "mid"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tag: ${{ github.sha }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  rstudio-test:
    needs: [vars, rstudio]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "rstudio"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tag: ${{ github.sha }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  sas-kernel-test:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "sas-kernel"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tag: ${{ github.sha }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  jupyterlab-cpu-test:
    needs: [vars, jupyterlab-cpu]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "jupyterlab-cpu"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tag: ${{ github.sha }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  sas-test:
    needs: [vars, sas]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "sas"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      repository-suffix: ${{ needs.vars.outputs.repository-suffix }}
      tag: ${{ github.sha }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

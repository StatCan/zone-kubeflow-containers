name: Build, test, and push Docker Images
on:
  push:
    branches:
      - "master"
      - "beta"
    paths:
      - ".github/workflows/*"

      - "images/**"
      - "!images/*/README.md"
      - "tests/**"
      - "!tests/README.md"
      - "docker-bake.hcl"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - ".github/workflows/*"
      
      - "images/**"
      - "!images/*/README.md"
      - "tests/**"
      - "!tests/README.md"
      - "docker-bake.hcl"
      - "requirements-dev.txt"

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      REGISTRY_NAME: "stcthezoneacr.azurecr.io"
      branch-name: ${{ steps.getBranch.outputs.branch-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Get branch name
        id: getBranch
        run: |
          chmod +x ./make_helpers/get_branch_name.sh
          BRANCH_NAME=$(./make_helpers/get_branch_name.sh)
          echo "branch-name=$BRANCH_NAME"
          echo "branch-name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate upstream image propagation
        run: python3 .github/scripts/validate_runtime_configuration.py

  # Upstream jupyter/docker-stacks publishes no Python 3.14 images, so build
  # its foundation -> base-notebook -> minimal-notebook -> scipy-notebook ->
  # datascience-notebook chain at a pinned commit with PYTHON_VERSION
  # overridden, and push the result to the ACR. datascience-notebook is the
  # same upstream image the previous base tracked, so this is a Python
  # version bump and nothing else -- the Conda R and Julia stacks it layers
  # on scipy are unchanged. The tag encodes the commit + python version, so
  # this job is a fast no-op whenever that tag already exists.
  upstream-datascience:
    needs: [vars]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
      is-diff: ${{ steps.upstream-diff.outputs.is-diff }}
    env:
      DOCKER_STACKS_REF: d7c65738a271df758c4a6cfe683587a06fec3ea8
      # Exact pin: a bare "3.14" lets the conda solver drift to the newest
      # 3.14.x on every fresh chain build; keep this in lockstep with the AVD
      # desktop rollout (3.14.5). Bumping it changes the tag below, which
      # triggers a one-off ~20 min chain rebuild.
      PYTHON_VERSION: "3.14.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image ref
        id: ref
        run: echo "image=${{ needs.vars.outputs.REGISTRY_NAME }}/datascience-notebook:python${PYTHON_VERSION}-${DOCKER_STACKS_REF:0:12}" >> "$GITHUB_OUTPUT"

      - name: Detect upstream definition changes
        id: definition-diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "PR base commit unavailable; forcing a downstream rebuild"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --unified=0 "${BASE_SHA}" HEAD -- .github/workflows/docker.yaml \
            | grep -Eq '^[+-][[:space:]]+(DOCKER_STACKS_REF|PYTHON_VERSION):'; then
            echo "Upstream ref or Python version differs from the PR base"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream ref and Python version match the PR base"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ needs.vars.outputs.REGISTRY_NAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Check whether the image already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine whether downstream images must rebuild
        id: upstream-diff
        env:
          DEFINITION_CHANGED: ${{ steps.definition-diff.outputs.changed }}
          IMAGE_EXISTS: ${{ steps.exists.outputs.exists }}
        run: |
          if [ "${IMAGE_EXISTS}" != "true" ] || [ "${DEFINITION_CHANGED}" == "true" ]; then
            echo "is-diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout jupyter/docker-stacks
        if: steps.exists.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: jupyter/docker-stacks
          ref: ${{ env.DOCKER_STACKS_REF }}
          path: docker-stacks

      - name: Build the docker-stacks chain
        if: steps.exists.outputs.exists == 'false'
        run: |
          docker build ./docker-stacks/images/docker-stacks-foundation -t local/docker-stacks-foundation --build-arg PYTHON_VERSION="${PYTHON_VERSION}"
          docker build ./docker-stacks/images/base-notebook -t local/base-notebook --build-arg BASE_IMAGE=local/docker-stacks-foundation
          docker build ./docker-stacks/images/minimal-notebook -t local/minimal-notebook --build-arg BASE_IMAGE=local/base-notebook
          docker build ./docker-stacks/images/scipy-notebook -t local/scipy-notebook --build-arg BASE_IMAGE=local/minimal-notebook
          docker build ./docker-stacks/images/datascience-notebook -t "${{ steps.ref.outputs.image }}" --build-arg BASE_IMAGE=local/scipy-notebook

      - name: Push
        if: steps.exists.outputs.exists == 'false'
        run: docker push "${{ steps.ref.outputs.image }}"

  base:
    needs: [vars, upstream-datascience]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "base"
      directory: "base"
      # The CI-built datascience-notebook: the same upstream image as before,
      # rebuilt on Python 3.14 because upstream publishes no 3.14 tag.
      base-image: "${{ needs.upstream-datascience.outputs.image }}"
      parent-image-is-diff: "${{ needs.upstream-datascience.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  mid:
    needs: [vars, base]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "mid"
      directory: "mid"
      parent-image: "base"
      parent-image-is-diff: "${{ needs.base.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  rstudio:
    needs: [vars, mid]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "rstudio"
      directory: "rstudio"
      parent-image: "mid"
      parent-image-is-diff: "${{ needs.mid.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  sas-kernel:
    needs: [vars, rstudio]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "sas-kernel"
      directory: "sas_kernel"
      parent-image: "rstudio"
      parent-image-is-diff: "${{ needs.rstudio.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      SAS_SA_NAME: ${{ secrets.SAS_SA_NAME }}
      SAS_SA_KEY_1: ${{ secrets.SAS_SA_KEY_1 }}

  jupyterlab-cpu:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "jupyterlab-cpu"
      directory: "jupyterlab"
      parent-image: "sas-kernel"
      parent-image-is-diff: "${{ needs.sas-kernel.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  sas:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-steps.yaml
    with:
      image: "sas"
      directory: "sas"
      parent-image: "sas-kernel"
      parent-image-is-diff: "${{ needs.sas-kernel.outputs.is-diff }}"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      branch-name: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  # Test the Images

  base-test:
    needs: [vars, base]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "base"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  mid-test:
    needs: [vars, mid]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "mid"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  rstudio-test:
    needs: [vars, rstudio]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "rstudio"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  sas-kernel-test:
    needs: [vars, sas-kernel]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "sas-kernel"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  jupyterlab-cpu-test:
    needs: [vars, jupyterlab-cpu]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "jupyterlab-cpu"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

  sas-test:
    needs: [vars, sas]
    uses: ./.github/workflows/docker-pull-test.yaml
    with:
      image: "sas"
      registry-name: "${{ needs.vars.outputs.REGISTRY_NAME }}"
      tag: "${{ needs.vars.outputs.branch-name }}"
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      CVE_ALLOWLIST: ${{ secrets.CVE_ALLOWLIST}}

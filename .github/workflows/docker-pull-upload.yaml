name: Copy unchanged image into the PR repository

on:
  workflow_call:
    inputs:
      image:
        description: Image name
        required: true
        type: string
      registry-name:
        description: url of the registry <registy-name>
        required: true
        type: string
      repository-suffix:
        description: Suffix for the destination ACR repository
        required: true
        type: string
      tags:
        description: Space-separated tags to publish
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        description: The username for the container registry
        required: true
      REGISTRY_PASSWORD:
        description: The password for the container registry
        required: true

jobs:
  pull-upload:
    runs-on: ubuntu-latest
    steps:
      # Connect to Azure Container registry (ACR)
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ inputs.registry-name }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Copy target branch image to the PR repository
        shell: bash
        env:
          IMAGE: ${{ inputs.registry-name }}/${{ inputs.image }}
          REPOSITORY_SUFFIX: ${{ inputs.repository-suffix }}
          TAGS: ${{ inputs.tags }}
        run: |
          source="$IMAGE:v2"
          if [[ $GITHUB_BASE_REF == beta ]]; then
            source="$IMAGE-beta:latest"
            # The first PR precedes the beta push that creates the new repository.
            if ! result=$(docker buildx imagetools inspect "$source" 2>&1); then
              case "$result" in
                *"not found"*|*"manifest unknown"*|*"name unknown"*) source="$IMAGE:beta" ;;
                *) echo "$result" >&2; exit 1 ;;
              esac
            fi
          fi
          args=()
          for tag in $TAGS; do
            args+=(--tag "$IMAGE$REPOSITORY_SUFFIX:$tag")
          done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$source"

name: Check for changes in subdirectory

on:
  workflow_call:
    inputs:
      directory:
        description: The directory of the image files
        required: true
        type: string
      parent-image-is-diff:
        description: Parent image has been changed?
        default: "false"
        type: string
    outputs:
      is-diff:
        description: Is there a difference between the target branch and the current branch
        value: ${{ jobs.check-diff.outputs.is-diff }}

jobs:
  check-diff:
    runs-on: ubuntu-latest
    outputs:
      is-diff: ${{ steps.check-changes.outputs.is-diff }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: check-changes
        env:
          DIRECTORY: ${{ inputs.directory }}
          PARENT_CHANGED: ${{ inputs.parent-image-is-diff }}
        run: |
          changed=true
          # PR checkouts are merge commits. Their first parent is the exact target revision.
          if [[ $GITHUB_EVENT_NAME == pull_request && $PARENT_CHANGED == false ]]; then
            if git diff --quiet HEAD^1 HEAD -- "images/$DIRECTORY" ":(exclude,glob)**/README.md"; then
              changed=false
            else
              status=$?
              [[ $status == 1 ]] || exit "$status"
            fi
          fi
          echo "is-diff=$changed" >> "$GITHUB_OUTPUT"

name: organizes the steps taken to build, upload, and test the images

on:
  workflow_call:
    inputs:
      image:
        description: Image name
        required: true
        type: string
      directory:
        description: The directory of the image files
        required: true
        type: string
      parent-image:
        description: Parent image name
        required: false
        type: string
      parent-image-is-diff:
        description: Parent image has been changed?
        required: false
        type: string
        default: "false"
      base-image:
        description: The base image to build from if not located on our own repo
        required: false
        type: string
      registry-name:
        description: url of the registry <registy-name>
        required: true
        type: string
      repository-suffix:
        description: Suffix for the destination ACR repository
        required: true
        type: string
      tags:
        description: Space-separated tags to publish
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        description: The username for the container registry
        required: true
      REGISTRY_PASSWORD:
        description: The password for the container registry
        required: true
      SAS_SA_NAME:
        description: The name of the SAS storage account
        required: false
      SAS_SA_KEY_1:
        description: The access key to the SAS storage account
        required: false
    outputs:
      is-diff:
        description: Is there a difference between the master branch and the current branch
        value: ${{ jobs.check-diff.outputs.is-diff }}

jobs:
  check-diff:
    uses: ./.github/workflows/check-diff.yaml
    with:
      directory: ${{ inputs.directory }}
      parent-image-is-diff: ${{ inputs.parent-image-is-diff }}

  build-upload:
    needs: [check-diff]
    if: ${{ needs.check-diff.outputs.is-diff == 'true' }}
    uses: ./.github/workflows/docker-build-upload.yaml
    with:
      directory: ${{ inputs.directory }}
      image: ${{ inputs.image }}
      base-image: ${{ inputs.base-image || format('{0}/{1}{2}:{3}', inputs.registry-name, inputs.parent-image, inputs.repository-suffix, github.sha) }}
      registry-name: ${{ inputs.registry-name }}
      repository-suffix: ${{ inputs.repository-suffix }}
      tags: ${{ inputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      SAS_SA_NAME: ${{ secrets.SAS_SA_NAME }}
      SAS_SA_KEY_1: ${{ secrets.SAS_SA_KEY_1 }}

  pull-upload:
    needs: [check-diff]
    if: ${{ needs.check-diff.outputs.is-diff == 'false' }}
    uses: ./.github/workflows/docker-pull-upload.yaml
    with:
      image: ${{ inputs.image }}
      registry-name: ${{ inputs.registry-name }}
      repository-suffix: ${{ inputs.repository-suffix }}
      tags: ${{ inputs.tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
